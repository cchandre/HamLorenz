[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HamLorenz"
version = "0.1.12"
description = "Hamiltonian Lorenz-like models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-2-Clause"}
keywords = ["Lorenz models", "Hamiltonian", "symplectic integrators"]
authors = [
  {name="Cristel Chandre", email="cristel.chandre@cnrs.fr"},
]
maintainers = [
  {name="Cristel Chandre", email="cristel.chandre@cnrs.fr"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
	"numpy>=1.24.3",
  "sympy>=1.11.1",
  "pyhamsys~=0.65",
	"scipy>=1.11.3",
  "pathos>=0.3.4",
  "matplotlib>=3.7.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/cchandre/HamLorenz"
Repository = "https://github.com/cchandre/HamLorenz"
"Bug Tracker" = "https://github.com/cchandre/HamLorenz/issues"